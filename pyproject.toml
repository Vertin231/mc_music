[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-music"
version = "0.3.0"
description = "Compile MIDI and Python scores into Minecraft Java note-block datapacks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "mido>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mc-music = "mc_music.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
