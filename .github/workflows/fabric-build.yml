name: Fabric 1.20.4 build

on:
  push:
    branches:
      - fabric-midi-gui-1.20.4
      - midipack-0.1.2
      - midipack-0.1.3
  pull_request:
    branches:
      - fabric-midi-gui-1.20.4
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build Fabric mod
        working-directory: fabric-mod
        run: gradle build --no-daemon

      - name: Upload mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: midipack-fabric-1.20.4-0.1.3
          path: fabric-mod/build/libs/*.jar
          if-no-files-found: error
